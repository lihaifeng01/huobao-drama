# 发布 Docker 镜像（多架构 linux/amd64 + linux/arm64）
#
# 触发：推送 v* 标签（如 git tag v4.1.0 && git push origin v4.1.0），或在 Actions 页手动运行
# 推送目标：
#   - GHCR：ghcr.io/<owner>/huobao-drama（用内置 GITHUB_TOKEN，无需配置）
#   - Docker Hub：lhf/huobao-drama（仓库 Settings → Secrets 配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN 后启用）
#     镜像名可用仓库变量 DOCKERHUB_IMAGE 覆盖
# 同时保证该版本 Release 里有 latest.json（Docker 版「关于更新」读它比对版本）；
# 桌面版 publish-release.mjs 会以完整清单（含安装包）覆盖它。
name: Docker Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 4.1.0，不带 v）'
        required: true

permissions:
  contents: write
  packages: write

env:
  DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'lhf/huobao-drama' }}
  HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解析版本号
        id: ver
        run: |
          if [ -n "${{ inputs.version }}" ]; then v="${{ inputs.version }}"; else v="${GITHUB_REF_NAME#v}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "ghcr=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/huobao-drama" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 登录 Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 生成镜像标签
        id: tags
        run: |
          v="${{ steps.ver.outputs.version }}"
          tags="${{ steps.ver.outputs.ghcr }}:$v,${{ steps.ver.outputs.ghcr }}:latest"
          if [ "$HAS_DOCKERHUB" = "true" ]; then tags="$tags,$DOCKERHUB_IMAGE:$v,$DOCKERHUB_IMAGE:latest"; fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: HUOBAO_VERSION=${{ steps.ver.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 确保 Release 含 latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${{ steps.ver.outputs.version }}"; tag="v$v"
          gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1 \
            || gh release create "$tag" --repo "${{ github.repository }}" --title "$tag" --generate-notes
          if ! gh release view "$tag" --repo "${{ github.repository }}" --json assets -q '.assets[].name' | grep -qx latest.json; then
            printf '{"version":"%s","notes":"","platforms":{}}\n' "$v" > latest.json
            gh release upload "$tag" latest.json --repo "${{ github.repository }}"
          fi
