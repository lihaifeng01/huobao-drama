name: Bug 反馈
description: 报告运行中遇到的错误或异常行为
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！提交前请先搜索一下已有 issue，避免重复。
        **请勿在日志或截图中暴露 API Key、Token、密码等敏感信息。**
  - type: input
    id: version
    attributes:
      label: 版本号
      description: 桌面版见「关于」或安装包文件名；服务器部署填镜像 tag 或 commit。
      placeholder: 例如 4.1.4 / lihaifeng1995/huobao-drama:latest / a1b2c3d
    validations:
      required: true
  - type: dropdown
    id: deploy
    attributes:
      label: 运行方式
      options:
        - 桌面版 macOS (Apple Silicon)
        - 桌面版 macOS (Intel)
        - 桌面版 Windows
        - Docker 部署
        - 源码运行
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 出问题的环节
      multiple: true
      options:
        - 剧本改写
        - 资产提取
        - 生图
        - 分镜拆解
        - 生视频
        - 拼接导出 / FFmpeg
        - 字幕
        - 账号 / 权限 / 登录
        - 设置 / AI 服务配置
        - 安装 / 启动 / 更新
        - 其他
  - type: input
    id: provider
    attributes:
      label: 使用的 AI 服务 / 模型
      description: 与模型调用相关的问题请填写，例如 火山引擎 Seedance、Gemini、某中转站 + 模型名。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 发生了什么？期望是什么样？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开某个项目的第 N 集
        2. 点击「生成视频」
        3. 看到报错 ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 报错信息 / 日志
      description: 页面上的报错提示、后端日志片段（桌面版日志在 userData 目录下）。
      render: text
  - type: textarea
    id: extra
    attributes:
      label: 截图或补充信息
